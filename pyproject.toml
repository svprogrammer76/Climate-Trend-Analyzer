[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-trend-analyzer"
version = "1.0.0"
description = "A portfolio project for exploring simulated climate time series."
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<4.0", "numpy>=1.26,<3.0", "matplotlib>=3.8,<4.0", "scikit-learn>=1.4,<2.0"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32,<2.0"]

[tool.setuptools.packages.find]
where = ["src"]

